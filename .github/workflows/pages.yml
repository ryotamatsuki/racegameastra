name: CI and GitHub Pages
on:
  push:
    branches:
      - fix/four-lap-lane-change
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/four-lap-lane-change
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified fix and restore CI
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pages.yml
          git rm -f .github/workflows/fix-countdown-e2e.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ui/App.tsx tests/e2e/finish-regression.spec.ts tests/e2e/workshop.spec.ts .github/workflows/pages.yml
          git commit -m "fix: keep countdown live on slow render frames [slow-countdown-fixed]"
          git push origin HEAD:fix/four-lap-lane-change
