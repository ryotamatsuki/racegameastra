name: CI and GitHub Pages
on:
  push:
    branches: [fix/four-lap-lane-change]
permissions:
  contents: write
jobs:
  apply-lane-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/four-lap-lane-change
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Apply deterministic patch
        run: python3 scripts/apply_lane_cycle.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified source changes and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 398f0efcf87f6ca178d0d2014877670e99e52176 -- .github/workflows/pages.yml
          git rm -f scripts/apply_lane_cycle.py .github/workflows/apply-lane-cycle.yml
          git add src tests docs README.md .github/workflows/pages.yml
          git commit -m "feat: add four-lap lane cycle [lane-cycle-applied]"
          git push origin HEAD:fix/four-lap-lane-change
