name: Public finish regression
on:
  # The full Browser acceptance workflow already executes
  # tests/e2e/finish-regression.spec.ts on desktop and mobile. Keep this
  # dedicated public-site check available for targeted manual diagnosis only.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/finish-regression.spec.ts --project=chromium-desktop
        env:
          PUBLIC_URL: https://ryotamatsuki.github.io/racegameastra/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-finish-evidence
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 1
