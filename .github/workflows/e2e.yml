name: Browser acceptance
on:
  pull_request:
  workflow_run:
    workflows: ["CI and GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional deployed URL, e.g. https://ryotamatsuki.github.io/racegameastra/'
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    # Pull requests run once against the local test server. After a real Pages
    # deployment, the same full suite runs once against the public site.
    # Ignore workflow_run events produced by pull-request-only Pages builds so
    # that opening/updating a PR does not run the same browser matrix twice.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          PUBLIC_URL: ${{ github.event_name == 'workflow_run' && 'https://ryotamatsuki.github.io/racegameastra/' || inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}
          # Playwright's HTML report already carries retained failure traces and
          # attachments. Uploading test-results/ as well stores those traces a
          # second time without adding diagnostic value.
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 1
