name: Browser acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Optional deployed URL, e.g. https://ryotamatsuki.github.io/racegameastra/'
        required: false
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PUBLIC_URL: ${{ inputs.public_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
